[workspace]
members = ["crates/meeting"]
default-members = ["."]
resolver = "3"

[package]
name = "backend"
version = "1.1.7"
edition = "2024"
rust-version = "1.92"

[dependencies]
meeting-backend = { path = "crates/meeting" }
anyhow = "1.0.99"
argon2 = "0.5.3"
axum = { version = "0.8.8", features = ["multipart", "ws"] }
futures-util = "0.3"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
jsonwebtoken = "9.3.1"
# Already linked through jsonwebtoken; used directly for guest device actor HMACs.
ring = "0.17.14"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = "1.0.228"
serde_json = "1.0.147"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors", "trace", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# Enables OsRng used through argon2::password_hash::rand_core for password salts.
rand_core = { version = "0.6.4", features = ["getrandom"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
subtle = "2.6"
percent-encoding = "2.3"
