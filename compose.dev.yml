name: dm_radio

services:
  backend:
    build:
      context: .
      dockerfile: backend/dev.dockerfile
      # The Pi is its LAN DNS server; build steps must reach that resolver via the host.
      network: host
    environment:
      BIND_ADDR: 0.0.0.0:3001
      BODRIK_FM_JWT_SECRET: ${BODRIK_FM_JWT_SECRET:-}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MEDIA_DIR: ${MEDIA_DIR:-/app/backend/uploads}
      UPLOAD_TMP_DIR: ${UPLOAD_TMP_DIR:-/app/backend/uploads/tmp}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-}
      # The launcher shares Studio sessions with the derived meeting subdomain.
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      MEETING_PUBLIC_URL: ${MEETING_PUBLIC_URL:-}
      CONFERENCE_UNAVAILABLE_URL: ${CONFERENCE_UNAVAILABLE_URL:-}
      MEETING_TICKET_KEY: ${LOCAL_MEETING_TICKET_KEY:-}
      MEETING_ENABLED: "true"
      # Parallel smoke workers join from one host; keep production's default of 30.
      CONFERENCE_JOINS_PER_MINUTE: ${CONFERENCE_JOINS_PER_MINUTE:-600}
      TURN_ENABLED: ${LOCAL_TURN_ENABLED:-false}
      TURN_URLS: ${LOCAL_TURN_URLS:-}
      TURN_SHARED_SECRET: ${LOCAL_TURN_SHARED_SECRET:-}
      TURN_CREDENTIAL_TTL_SECONDS: ${LOCAL_TURN_CREDENTIAL_TTL_SECONDS:-3600}
      TURN_FORCE_RELAY: ${LOCAL_TURN_FORCE_RELAY:-false}
      MEETING_RTP_BIND: 0.0.0.0
      MEETING_RTP_ANNOUNCED_ADDRESS: ${LOCAL_SFU_ANNOUNCED_IP:-}
      MEETING_RTP_MIN: ${LOCAL_SFU_RTP_MIN:-40000}
      MEETING_RTP_MAX: ${LOCAL_SFU_RTP_MAX:-40100}
      MEETING_FFMPEG_PATH: /usr/bin/ffmpeg
      MEETING_MUSIC_RTP_HOST: 127.0.0.1
      REPLACEMENT_BROWSER_ORIGINS: ${REPLACEMENT_BROWSER_ORIGINS:-}
      REPLACEMENT_INVITE_BASE_URL: ${REPLACEMENT_INVITE_BASE_URL:-}
      REPLACEMENT_BYE_URL: ${REPLACEMENT_BYE_URL:-}
      REPLACEMENT_UI_BUTTONS_JSON: "false"
      REPLACEMENT_BRAND_JSON: "false"
      REPLACEMENT_AVATAR_DIR: /uploads/avatars
      REPLACEMENT_CHAT_IMAGE_DIR: /uploads/chat
      REPLACEMENT_DIAGNOSTICS_DIR: /logs/diagnostics
      REPLACEMENT_DIAGNOSTICS_RETENTION_DAYS: "14"
      REPLACEMENT_DIAGNOSTICS_FILE_BYTES: "10485760"
      REPLACEMENT_DIAGNOSTICS_TOTAL_BYTES: "104857600"
      MEETING_TICKET_ISSUER: player
      MEETING_TICKET_AUDIENCE: meeting
      YOUTUBE_MAX_CONCURRENT_DOWNLOADS: ${YOUTUBE_MAX_CONCURRENT_DOWNLOADS:-2}
      YTDLP_COOKIES_PATH: ${YTDLP_COOKIES_PATH:-}
      DB_PATH: ${DB_PATH:-/app/backend/data/app.db}
      MIGRATIONS_DIR: ${MIGRATIONS_DIR:-/app/backend/migrations}
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
    volumes:
      - ./backend:/app/backend
      - backend_target:/app/backend/target
      - backend_mbx_cache:/var/cache/mbx
      - ./uploads:/app/backend/uploads
      - ./data:/app/backend/data
      - dev_mirotalk_avatars:/uploads/avatars
      - dev_mirotalk_chat_images:/uploads/chat
      - dev_mirotalk_client_diagnostics:/logs/diagnostics
    init: true
    ports:
      - "127.0.0.1:3001:3001"
      - "${LOCAL_SFU_RTP_MIN:-40000}-${LOCAL_SFU_RTP_MAX:-40100}:${LOCAL_SFU_RTP_MIN:-40000}-${LOCAL_SFU_RTP_MAX:-40100}/udp"
      - "${LOCAL_SFU_RTP_MIN:-40000}-${LOCAL_SFU_RTP_MAX:-40100}:${LOCAL_SFU_RTP_MIN:-40000}-${LOCAL_SFU_RTP_MAX:-40100}/tcp"

  # Viewer only: no Telegram credentials are passed into this service.
  logging:
    profiles: [logging]
    build:
      context: .
      dockerfile: infra/logging/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      TELEGRAM_ALERTS_ENABLED: "false"
    ports:
      - "127.0.0.1:8088:8080"
    networks: [logging]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dev_logging_data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: [CMD, env, -i, DOZZLE_NO_ANALYTICS=true, /dozzle, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: dev.dockerfile
      network: host
    command: sh -c "bun install --frozen-lockfile && bun run dev"
    environment:
      CI: "true"
      LOCAL_DEV_HOST: ${LOCAL_DEV_HOST:-localhost}
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:3001}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@bodrik.fm}
    # Compose Watch writes Linux-local source so Turbopack receives native events.
    volumes:
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    develop:
      watch:
        - action: sync
          initial_sync: true
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
            - out/
            - .releases/
            - .smoke-results/
            - public/retained-meeting/
            - public/meeting-assets/
            - public/brand/
            - package.json
            - bun.lock
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/bun.lock
  meet:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${LOCAL_PROXY_PORT:-8380}:80"
    volumes:
      - ./infra/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/chat-attachments:/data/chat-attachments:ro
    depends_on:
      - frontend
      - backend

networks:
  logging:

volumes:
  dev_logging_data:
  backend_target:
  backend_mbx_cache:
  meeting_target:
  meeting_mbx_cache:
  frontend_node_modules:
  frontend_next:
  dev_mirotalk_avatars:
    name: dm_radio_dev_mirotalk_avatars
  dev_mirotalk_client_diagnostics:
    name: dm_radio_dev_mirotalk_client_diagnostics
  dev_mirotalk_chat_images:
    name: dm_radio_dev_mirotalk_chat_images
