server {
    listen 80;
    # Host Caddy owns TLS and forwards both the player and meeting hostnames here.
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 10m; # Match production; the image handler enforces the 5 MiB file limit.

    # Slug invitations and replacement tickets must reach player authority.
    location ~ ^/api/(conferences|rooms)/ {
        set $backend_service backend;
        proxy_pass http://$backend_service:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Persistent bytes are readable only after Rust authorizes the current room owner.
    location ^~ /_chat_attachments/ {
        internal;
        alias /data/chat-attachments/;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /api/meeting/chat-attachments {
        set $meeting_service backend;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_pass http://$meeting_service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Final public meeting signaling and replacement-owned uploads use the Rust service.
    location ~ ^/(ws/meeting|api/meeting)/ {
        set $meeting_service backend;
        proxy_pass http://$meeting_service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
    }

    # Rust publishes and serves avatar/chat images from its own volumes (formerly the static shell).
    location ~ ^/uploads/(avatars|chat)/ {
        set $meeting_service backend;
        proxy_pass http://$meeting_service:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public room state includes the authoritative Studio theme; keep it on the meeting origin.
    location /ws/rooms/ {
        set $backend_service backend;
        proxy_pass http://$backend_service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
    }

    # Player/Studio API, state sockets and media, so the whole app also works over HTTPS.
    location /api/ {
        set $backend_service backend;
        client_max_body_size 1g; # Matches the Studio upload limit and production player vhost.
        proxy_request_buffering off;
        proxy_pass http://$backend_service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        set $backend_service backend;
        proxy_pass http://$backend_service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location /media/ {
        set $backend_service backend;
        proxy_pass http://$backend_service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The meeting document and its assets are owned by the frontend.

    location = /brand {
        set $frontend_service frontend;
        proxy_pass http://$frontend_service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ "^/room/[A-Za-z0-9_-]{1,128}$" {
        set $frontend_service frontend;
        proxy_pass http://$frontend_service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /meeting {
        set $frontend_service frontend;
        proxy_pass http://$frontend_service:3000/meeting;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /_next/ {
        set $frontend_service frontend;
        proxy_pass http://$frontend_service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        set $frontend_service frontend;
        proxy_pass http://$frontend_service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
